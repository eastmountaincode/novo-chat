<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="novo-chat-base-path" content="__NOVO_CHAT_BASE_PATH__" />
    <title>novo chat</title>
    <link rel="icon" href="static/favicon.ico" sizes="any" />
    <link rel="icon" href="static/favicon.png" type="image/png" />
    <link rel="stylesheet" href="static/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="settings">
        <div class="topbar">
          <img class="app-icon" src="static/favicon.png" alt="" aria-hidden="true" />
          <h1>novo chat</h1>
        </div>
        <div class="settings-body">
          <label class="field">
            <span>Corpus</span>
            <select id="corpus"></select>
          </label>

          <div id="indexPanel" class="index-panel"></div>
          <button id="indexBtn" type="button" class="index-btn">Rebuild index</button>

          <label class="field context-field">
            <span>Context chunks</span>
            <div class="slider-row">
              <input id="maxSources" type="range" min="1" max="16" value="12" />
              <output id="maxSourcesValue" class="mono slider-value">12</output>
            </div>
          </label>

          <div class="field">
            <label for="model">Model</label>
            <select id="model"></select>
            <div id="runtime" class="runtime"></div>
            <div id="modelSpecs" class="specs"></div>
          </div>

          <button id="clearBtn" type="button" class="clear-btn">Clear conversation</button>

          <div class="user-session">
            <div id="userName" class="user-name"></div>
            <a id="novoLink" class="logout-btn novo-link" href="#">Back to Novo</a>
          </div>
        </div>
      </aside>

      <main class="chat">
        <div id="computeBanner" class="compute-banner" role="status" hidden>
          <strong>Compute is unavailable.</strong>
          <span id="computeDetail">The compute service may be offline or reconnecting. Novo is still available.</span>
          <button id="retryButton" type="button">Retry</button>
        </div>

        <div class="chat-status">
          <span id="activeCorpus" class="active-corpus">-</span>
          <span class="slash">/</span>
          <span id="activeModel" class="active-model">-</span>
        </div>

        <section id="messages" class="messages" aria-live="polite"></section>

        <form id="askForm" class="composer">
          <textarea id="question" rows="1" placeholder="Ask a question..." required></textarea>
          <button id="askBtn" type="submit" aria-label="Send">Send</button>
        </form>
      </main>

      <aside class="sources">
        <div class="sources-header">
          <h2>Retrieved</h2>
          <div id="contextMeter" class="context-meter"></div>
        </div>
        <div id="sources" class="source-list">
          <div class="empty">No retrieval yet.</div>
        </div>
      </aside>
    </div>
    <script src="static/app.js"></script>
  </body>
</html>
